<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Excel Reconciliation App</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form" autocomplete="on">
    <h1>Excel Reconciliation App</h1>
    <p class="sub">Sign in with the account your administrator created.</p>

    <div id="error-slot"></div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <button class="primary" type="submit" id="submit">Sign in</button>

    <div class="row" style="justify-content:center;margin-top:16px">
      <button type="button" class="ghost" id="theme-toggle" style="font-size:12px;padding:4px 10px">
        Switch theme
      </button>
    </div>
  </form>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
